name: Sign Shortcut
on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Prepare and sign (all output logged)
        if: always()
        run: |
          exec > >(tee -a sign-log.txt) 2>&1
          set -x
          pwd
          ls -la
          SRC=$(ls *.shortcut 2>/dev/null | head -1)
          echo "SRC=$SRC"
          if [ -z "$SRC" ]; then echo "NO_SHORTCUT_FILE_IN_REPO"; exit 0; fi
          cp "$SRC" input.shortcut
          plutil -convert binary1 -o input.shortcut input.shortcut && echo PLUTIL_OK
          file input.shortcut
          shortcuts sign --mode anyone --input input.shortcut --output signed.shortcut && echo SIGN_OK || echo SIGN_FAIL
          ls -la

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sign-log
          path: sign-log.txt
          if-no-files-found: warn

      - name: Upload signed file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-shortcut
          path: signed.shortcut
          if-no-files-found: ignore
